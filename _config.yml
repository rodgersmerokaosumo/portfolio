###############################################################################
# Site identity
###############################################################################
title:       "Rodgers Meroka Osumo"
tagline:     "Data Consulting & AI Strategy"
description: "Data consulting, AI strategy, and geospatial solutions — turning complex data into business impact."
locale:      "en"
og_image:    "/assets/img/avatar.jpeg"
twitter_image: "/assets/img/avatar.jpeg"

# ── Where the site will live ──
url:     "https://rodgersmerokaosumo.github.io"
baseurl: "/portfolio"   # "" if repo is <username>.github.io
timezone: "Africa/Nairobi"

###############################################################################
# Theme & plugins
###############################################################################
theme: "jekyll-theme-journal-clone"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate-v2
  - jekyll-archives

# Ensure Jekyll processes your custom stylesheet
include:
  - assets/css/main.scss

exclude:
  - scripts/
  - CLAUDE.md
  - docs/


###############################################################################
# Pagination settings
###############################################################################

pagination:                       # global settings for paginate-v2
  enabled: true                   # turn it on
  collection: posts               # paginate your posts
  per_page: 5                     # 5 posts per page
  permalink: "/blog/page/:num/"   # URL pattern for page 2+
  first_page_url: "/blog/"        # your blog’s main page
  sort_field: ‘date’              # sort by date
  sort_reverse: true              # newest first


###############################################################################
# Build settings
###############################################################################
markdown:    kramdown
highlighter: rouge
future:      true

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

###############################################################################
# Collections
###############################################################################
collections:
  projects:
    output: true
    permalink: /:collection/:name/

###############################################################################
# Layout defaults
###############################################################################
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      featured_image: "/assets/img/blog-hero.jpg"
  -
    scope:
      path: ""          
      type: "pages"
    values:
      layout: "page"
  -
    scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

###############################################################################
# Navigation (header links)
###############################################################################
nav:
  - title: "Services"
    url: "/services/"
  - title: "Work"
    url: "/projects/"
  - title: "Blog"
    url: "/blog/"
    highlight: true
  - title: "About"
    url: "/about/"
  - title: "Contact"
    url: "/contact/"

github_username: rodgersmerokaosumo

###############################################################################
# Author & Social (for footer or bio includes)
###############################################################################
author:
  name: "Rodgers Meroka Osumo"
  avatar: "/assets/img/avatar.jpeg"
  email: "osumorodgersmeroka@gmail.com"

social_links:
  twitter: osumo_meroka
  github: rodgersmerokaosumo
  linkedin: https://www.linkedin.com/in/rodgersmerokaosumo/

# Disqus comments
disqus:
  shortname: portfolio-iuncitmsgs

feed:
  path: feed.xml
  title: "Osumo Rodgers Blog Updates"
  description: "Stay up to date with my latest posts"



###############################################################################
# Google Analytics (optional)
###############################################################################
google_analytics: G-XSTELV0HPS

