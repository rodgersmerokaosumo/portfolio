<nav class="navbar" aria-label="Main navigation">
  <div class="navbar-inner">
    <a href="{{ '/' | relative_url }}" class="navbar-brand">
      <img src="{{ '/assets/img/avatar.jpeg' | relative_url }}" alt="" class="navbar-avatar">
      <span class="navbar-name">{{ site.title }}</span>
    </a>

    <button class="navbar-toggle" id="navbar-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>

    <ul class="navbar-nav" id="navbar-nav">
      {% for item in site.nav %}
        <li><a href="{{ item.url | relative_url }}" {% if page.url == item.url %}class="active"{% endif %}>{{ item.title }}</a></li>
      {% endfor %}
    </ul>
  </div>
</nav>
