<!DOCTYPE html>
<html lang="{{ page.lang | default: site.locale }}">
  <head>
    {% include head.html %}
  </head>
  <body>
    <header class="site-header" id="site-header">
      {% include header.html %}
    </header>

    <main class="site-main">
      {{ content }}
    </main>

    <footer class="site-footer">
      {% include footer.html %}
    </footer>

    <script>
      const siteHeader = document.getElementById('site-header');
      const navToggle = document.getElementById('navbar-toggle');
      const navMenu = document.getElementById('navbar-nav');

      // Sticky nav shadow on scroll
      window.addEventListener('scroll', function() {
        if (window.scrollY > 0) {
          siteHeader.classList.add('scrolled');
        } else {
          siteHeader.classList.remove('scrolled');
        }
      });

      // Mobile hamburger toggle
      navToggle.addEventListener('click', function() {
        const isOpen = document.body.classList.toggle('mobile-nav-open');
        navToggle.setAttribute('aria-expanded', isOpen);
      });

      // Close on nav link click (mobile)
      navMenu.querySelectorAll('a').forEach(function(link) {
        link.addEventListener('click', function() {
          document.body.classList.remove('mobile-nav-open');
          navToggle.setAttribute('aria-expanded', 'false');
        });
      });

      // Close on outside click
      document.addEventListener('click', function(e) {
        if (!siteHeader.contains(e.target) && document.body.classList.contains('mobile-nav-open')) {
          document.body.classList.remove('mobile-nav-open');
          navToggle.setAttribute('aria-expanded', 'false');
        }
      });

      // Close on Escape
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && document.body.classList.contains('mobile-nav-open')) {
          document.body.classList.remove('mobile-nav-open');
          navToggle.setAttribute('aria-expanded', 'false');
          navToggle.focus();
        }
      });

      // Scroll-reveal: Intersection Observer
      (function() {
        var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var targets = document.querySelectorAll('.reveal, .reveal-left, .reveal-right, .reveal-scale, .reveal-children');

        if (prefersReduced || !('IntersectionObserver' in window)) {
          targets.forEach(function(el) { el.classList.add('revealed'); });
          return;
        }

        var observer = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('revealed');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.15, rootMargin: '0px 0px -50px 0px' });

        targets.forEach(function(el) { observer.observe(el); });
      })();
    </script>
  </body>
</html>
